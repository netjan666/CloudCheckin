version: 2.1

orbs:
  node: circleci/node@5.1.0

jobs:
  checkin:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install curl_cffi python-dotenv
      - run:
          name: Run NodeSeek check-in
          command: |
            python -m nodeseek.nodeseek
          environment:
            NODESEEK_COOKIE: << pipeline.env.NODESEEK_COOKIE >>
            TELEGRAM_TOKEN: << pipeline.env.TELEGRAM_TOKEN >>
            TELEGRAM_CHAT_ID: << pipeline.env.TELEGRAM_CHAT_ID >>

workflows:
  daily_checkin:
    triggers:
      - schedule:
          cron: "0 2 * * *"
          filters:
            branches:
              only: [main]
    jobs:
      - checkin
