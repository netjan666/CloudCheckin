name: NodeSeek Check-in

on:
  schedule:
    - cron: '0 2 * * *'  # UTC 2:00 = Beijing 10:00
  workflow_dispatch:

jobs:
  nodeseek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi python-dotenv
      - name: Run NodeSeek sign-in
        id: checkin
        run: |
          python3 << 'PYTHON'
          import os, json
          from curl_cffi import requests
          
          cookie = os.environ.get('NODESEEK_COOKIE', '').strip()
          if not cookie:
              print("ERROR: NODESEEK_COOKIE not set")
              exit(1)
          
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Origin': 'https://www.nodeseek.com',
              'Referer': 'https://www.nodeseek.com/board',
              'Content-Type': 'application/json',
              'Cookie': cookie,
          }
          
          resp = requests.post('https://www.nodeseek.com/api/attendance?random=true', 
                               headers=headers, impersonate='chrome136', timeout=30)
          print(f"Status: {resp.status_code}")
          print(f"Response: {resp.text}")
          
          # 判断成功
          if resp.status_code == 200:
              try:
                  data = resp.json()
                  if data.get('success'):
                      print("✅ 签到成功")
                      exit(0)
              except:
                  pass
          
          # 500 且已签到也算成功
          if resp.status_code == 500 and '已完成' in resp.text:
              print("✅ 今天已完成签到")
              exit(0)
          
          print(f"❌ 签到失败: {resp.text[:200]}")
          exit(1)
          PYTHON
        env:
          NODESEEK_COOKIE: ${{ secrets.NODESEEK_COOKIE }}
      
      - name: Notify Telegram
        if: always()
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=📅 NodeSeek 签到完成! $(date '+%Y-%m-%d %H:%M')" \
            -d "parse_mode=HTML"
